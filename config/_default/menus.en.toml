# Three content types first, then the two ways to browse.
# Labels are display-only — the tags they point at (Books, Short Story,
# Personal Essay) are unchanged.

[[main]]
name = "Books"
pre = "book"
pageRef = "tags/books"
weight = 1

[[main]]
name = "Fiction"
pre = "writing"
pageRef = "tags/short-story"
weight = 2

[[main]]
name = "Essays"
pre = "lightbulb"
pageRef = "tags/personal-essay"
weight = 3

[[main]]
name = "Archive"
pre = "list"
url = "/archive"
weight = 4

[[main]]
name = "Explore"
pre = "soundcloud"
pageRef = "tags"
weight = 5

# Footer. RSS lives here rather than in the main nav: the nav is for places to
# read something, and a feed is a mechanism. Feed readers auto-discover it from
# the <link rel="alternate"> tag regardless, but without a visible link anyone
# who copies feed URLs by hand has no way to find it.
[[footer]]
name = "RSS"
pre = "rss"
url = "/index.xml"
weight = 1
